# Adds the TLS entry point to compose.production.example.yaml for a host that
# faces the Internet directly. Caddy owns ports 80 and 443 and is the only
# proxy nginx trusts.
#
#   docker compose --env-file runtime.env \
#     -f compose.production.example.yaml -f deploy/compose.edge.yaml up -d
services:
  web:
    environment:
      QUENDA_TRUSTED_PROXY_CIDR: 172.28.10.20/32

  caddy:
    image: caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    environment:
      QUENDA_DOMAIN: ${QUENDA_DOMAIN:?Set the public domain name}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact address}
      CADDY_TLS_MODE: ${CADDY_TLS_MODE:-}
    ports:
      - "${QUENDA_HTTP_PUBLISH:-80}:80"
      - "${QUENDA_HTTPS_PUBLISH:-443}:443"
      - "${QUENDA_HTTPS_PUBLISH:-443}:443/udp"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp
    networks:
      edge:
        ipv4_address: 172.28.10.20
    depends_on:
      web: { condition: service_healthy }

volumes:
  caddy-data:
  caddy-config:
