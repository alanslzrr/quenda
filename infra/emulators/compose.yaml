# Local cloud emulators used by `pnpm infra:validate <cloud>`. Each one runs
# alone under its profile; none needs credentials or reaches a real cloud.
name: quenda-emulators

services:
  oci:
    profiles: [oci]
    image: floci/floci-oci:0.7.0@sha256:088bb759252560921adf1776c9114e62b26ce589f267d4afb13f2ebba20e4a8c
    environment:
      FLOCI_OCI_HOSTNAME: oci
      FLOCI_OCI_BASE_URL: http://oci:4599

  azure:
    profiles: [azure]
    image: floci/floci-az:0.17.0@sha256:40f1bbf1ef13569c6eacb47e565bf4cd28785ca833208dcc074910e13aec64ea
    environment:
      # azurerm discovers the cloud over HTTPS; the certificate names this host.
      FLOCI_AZ_TLS_ENABLED: "true"
      FLOCI_AZ_HOSTNAME: azure

  gcp:
    profiles: [gcp]
    image: floci/floci-gcp:0.13.0@sha256:a59403d43d524b1a08282d67d541a6d37bf7868cbd9d1311caa0d2983adf6f46
    environment:
      FLOCI_GCP_HOSTNAME: gcp

  aws:
    profiles: [aws]
    build:
      context: aws
    command: ["-p", "9297", "--telemetry", "off"]
    environment:
      HOME: /home/emulator
    volumes:
      - aws-emulator:/home/emulator/.aws/emulator

# Created by `pnpm infra:validate`, which also attaches the OpenTofu runner.
networks:
  default:
    name: quenda-emulators
    external: true

volumes:
  aws-emulator:
