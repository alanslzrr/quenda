services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: quenda
      POSTGRES_USER: quenda_bootstrap
      POSTGRES_PASSWORD: ${BOOTSTRAP_DATABASE_PASSWORD:?Set a local bootstrap password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quenda_bootstrap -d quenda"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
