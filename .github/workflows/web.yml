name: Web CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  TZ: UTC

jobs:
  checks:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./ci/actions/setup
      - name: Instalar dependencias de la aplicación web
        run: pnpm --dir web install --frozen-lockfile --ignore-scripts
      - name: Tipos, lint y pruebas unitarias
        run: pnpm --dir web check
      - name: Compilar el paquete estático
        run: pnpm --dir web build

  browser:
    name: Web browser
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./ci/actions/setup
      - name: Instalar dependencias de la aplicación web
        run: pnpm --dir web install --frozen-lockfile --ignore-scripts
      - name: Preparar PostgreSQL y btree_gist
        run: bash ci/setup-postgres.sh
      - name: Instalar Chromium de Playwright
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Ejecutar pruebas de navegador y accesibilidad
        run: pnpm --dir web test:browser
      - name: Conservar trazas de las pruebas fallidas
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-browser-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7
